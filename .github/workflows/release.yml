name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=Signed with the release key." >> "$GITHUB_ENV"
          else
            echo "SIGNING=Signed with a debug key: a later signed release needs an uninstall first." >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          # A fixed name, so releases/latest/download/easynote.apk always works.
          mv build/app/outputs/flutter-apk/app-release.apk easynote.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: easynote.apk
          body: |
            **Android** (phone, e-ink tablet): download `easynote.apk` and open it on the device.
            **Linux**: download `easynote-linux-x64.tar.gz`, then run `scripts/install-linux.sh easynote-linux-x64.tar.gz` from the repository.

            ${{ env.SIGNING }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter build linux --release
      - run: |
          tar -czf easynote-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: softprops/action-gh-release@v2
        with:
          files: easynote-linux-x64.tar.gz
